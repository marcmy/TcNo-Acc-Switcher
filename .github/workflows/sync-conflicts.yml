name: Sync conflicts

on:
  push:
    branches:
      - upstream-sync

permissions:
  contents: write

concurrency:
  group: sync-conflicts
  cancel-in-progress: true

env:
  FORK_BRANCH: master

jobs:
  check:
    if: github.repository == 'marcmy/TcNo-Acc-Switcher'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out upstream-sync
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes made with GITHUB_TOKEN don't trigger the pull request's CI
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Check for conflict markers
        shell: bash
        run: |
          set -euo pipefail
          git diff -z --name-only --diff-filter=AMR "origin/$FORK_BRANCH" HEAD \
              | xargs -0 -r grep -IlE '^(<{7}|>{7})( |$)' -- > "$RUNNER_TEMP/markers.txt" || true

          if [[ -s "$RUNNER_TEMP/markers.txt" ]]; then
              echo "### Conflict markers remain" >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r file; do
                  echo "::error file=$file::Conflict markers remain"
                  echo "- \`$file\`" >> "$GITHUB_STEP_SUMMARY"
              done < "$RUNNER_TEMP/markers.txt"
              exit 1
          fi
          echo "No conflict markers left."

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Regenerate lockfiles
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && pnpm install --lockfile-only)
          go mod tidy -e
          if git diff --quiet; then
              echo "Lockfiles are up to date."
              exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: regenerate frontend/pnpm-lock.yaml and go.sum"
          git push origin HEAD:upstream-sync
