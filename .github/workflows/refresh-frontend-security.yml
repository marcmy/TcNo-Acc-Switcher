name: Regenerate TcNo frontend security lockfile (temporary)
on:
  push:
    branches:
      - maintenance/security-pnpm-2026-10

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh and test frontend dependencies
        working-directory: frontend
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm test
          pnpm run build
      - name: Push updated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
          else
            git commit -m 'chore: update frontend security lockfile [skip ci]'
            git push origin HEAD:maintenance/security-pnpm-2026-10
          fi
