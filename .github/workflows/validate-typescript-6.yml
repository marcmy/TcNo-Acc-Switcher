name: Validate TypeScript 6 frontend upgrade (temporary)
on:
  push:
    branches: [maintenance/typescript-6-validation]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Install Wails CLI beta.27
        shell: pwsh
        run: |
          $goBin = Join-Path $env:USERPROFILE 'go\bin'
          $env:Path = "$goBin;$env:Path"
          Add-Content $env:GITHUB_PATH $goBin
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: Install frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Generate bindings
        run: wails3 generate bindings -f "-tags production,devtools" -clean=true -ts
      - name: Typecheck, test and build
        working-directory: frontend
        shell: pwsh
        run: |
          pnpm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
