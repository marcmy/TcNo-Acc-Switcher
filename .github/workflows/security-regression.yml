name: Security regression tests

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'frontend/**'
      - '.github/workflows/security-regression.yml'
  push:
    branches: [master]
    paths:
      - 'internal/**'
      - 'frontend/**'
      - '.github/workflows/security-regression.yml'

permissions:
  contents: read

jobs:
  go-regressions:
    name: Go security regression tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - run: go test ./internal/basic ./internal/platform ./internal/security ./internal/steamguard/mafile ./internal/app

  frontend-routes:
    name: Frontend route regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install -g pnpm@11.0.8
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/stores/routeCodec.test.ts
