name: One-time dependency lock refresh

on:
  push:
    branches: [chore/batch-oct-2026-dependency-updates]
    paths:
      - '.github/workflows/refresh-batched-locks.yml'

permissions:
  contents: write

jobs:
  refresh:
    name: Regenerate Go and pnpm locks for integration PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install -g pnpm@11.0.8
      - name: Regenerate Go module graph
        run: go mod tidy
      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: pnpm install --lockfile-only
      - name: Verify lockfile corresponds to the package manifest
        working-directory: frontend
        run: pnpm install --frozen-lockfile --lockfile-only
      - name: Commit dependency lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum frontend/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate combined Go and pnpm dependency locks"
            git push origin HEAD:chore/batch-oct-2026-dependency-updates
          fi
